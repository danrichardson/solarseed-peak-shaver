blueprint:
  name: "Solarseed - Start Grid Charging"
  description: >
    Listens for the Solarseed Peak Shaver charge_start event and switches
    your inverter to grid charging mode. Configure with your inverter's
    mode entity and the value that enables grid charging.
  domain: automation
  source_url: https://github.com/danrichardson/solarseed-peak-shaver
  input:
    inverter_mode_entity:
      name: Inverter mode entity
      description: >
        The select or switch entity that controls your inverter's operating mode.
        Examples: select.ac500_ups_mode, select.eg4_work_mode, switch.inverter_grid_charge
      selector:
        entity:
          domain:
            - select
            - switch
    charge_mode_value:
      name: Grid charging mode value
      description: >
        The value to set for grid charging. For select entities, this is the
        option name (e.g. "STANDARD", "Grid First", "Charge"). For switch
        entities, use "on".
      selector:
        text:

trigger:
  - platform: event
    event_type: solarseed_peak_shaver_charge_start

action:
  - variables:
      inverter_entity: !input inverter_mode_entity

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ inverter_entity.split('.')[0] == 'select' }}
        sequence:
          - action: select.select_option
            target:
              entity_id: !input inverter_mode_entity
            data:
              option: !input charge_mode_value
      - conditions:
          - condition: template
            value_template: >
              {{ inverter_entity.split('.')[0] == 'switch' }}
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input inverter_mode_entity

mode: single
