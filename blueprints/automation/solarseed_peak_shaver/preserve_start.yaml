blueprint:
  name: "Solarseed - Seasonal Preservation"
  description: >
    Listens for the Solarseed Peak Shaver preserve_start event and switches
    your inverter to a battery-preserving mode during low-solar months.
    This prevents the battery from draining overnight when there won't be
    enough sun to replenish it the next day.
  domain: automation
  source_url: https://github.com/danrichardson/solarseed-peak-shaver
  input:
    inverter_mode_entity:
      name: Inverter mode entity
      description: >
        The select or switch entity that controls your inverter's operating mode.
      selector:
        entity:
          domain:
            - select
            - switch
    preserve_mode_value:
      name: Preservation mode value
      description: >
        The value to set for battery preservation. This should be a mode
        where the inverter holds battery charge rather than discharging it.
        Examples: "TIME_CONTROL", "Standby", "Grid First".
      selector:
        text:

trigger:
  - platform: event
    event_type: solarseed_peak_shaver_preserve_start

action:
  - variables:
      inverter_entity: !input inverter_mode_entity

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ inverter_entity.split('.')[0] == 'select' }}
        sequence:
          - action: select.select_option
            target:
              entity_id: !input inverter_mode_entity
            data:
              option: !input preserve_mode_value
      - conditions:
          - condition: template
            value_template: >
              {{ inverter_entity.split('.')[0] == 'switch' }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input inverter_mode_entity

mode: single
