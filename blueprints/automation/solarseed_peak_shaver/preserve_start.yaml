blueprint:
  name: "Solarseed - Off-Peak Battery Hold"
  description: >
    Listens for the Solarseed Peak Shaver preserve_start event and holds
    your battery level after peak hours during low-solar months. The inverter
    draws from the grid for household loads instead of draining stored energy
    that won't be replenished by tomorrow's sun.
  domain: automation
  source_url: https://github.com/danrichardson/solarseed-peak-shaver
  input:
    inverter_mode_entity:
      name: Inverter mode entity
      description: >
        The select or switch entity that controls your inverter's operating mode.
      selector:
        entity:
          domain:
            - select
            - switch
    preserve_mode_value:
      name: Hold mode value
      description: >
        The value to set for battery hold. This should be a mode where the
        inverter holds battery charge and draws from the grid instead.
        Examples: "TIME_CONTROL", "PASSTHROUGH", "Grid First".
      selector:
        text:

trigger:
  - platform: event
    event_type: solarseed_peak_shaver_preserve_start

action:
  - variables:
      inverter_entity: !input inverter_mode_entity

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ inverter_entity.split('.')[0] == 'select' }}
        sequence:
          - action: select.select_option
            target:
              entity_id: !input inverter_mode_entity
            data:
              option: !input preserve_mode_value
      - conditions:
          - condition: template
            value_template: >
              {{ inverter_entity.split('.')[0] == 'switch' }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input inverter_mode_entity

mode: single
