blueprint:
  name: "Solarseed - Off-Peak Battery Hold"
  description: >
    Acts on the Solarseed Peak Shaver event `solarseed_peak_shaver_preserve_start`:
    puts the inverter in a mode that keeps the battery's charge and runs the
    house from the grid. The learned planner holds on the night before a TOU
    day, from peak end until mid-peak start (when charge_stop ends it): while
    it waits for the night charge to begin and after the charge is done,
    unless there is more on board than the day needs. The classic planner
    (legacy) fires it after peak in its hold months. The mode you pick must not
    discharge the battery.


    Bluetti AC500 example (Bluetti integration): mode entity
    `select.ac500_ups_mode`, value `TIME_CONTROL`. On the unit this was built
    with, that mode passes the grid through to the house and keeps the
    battery; what it does depends on the time-control windows set in the
    Bluetti app, so watch your own unit for one evening. Make one automation
    from each of the three Solarseed blueprints, with the same mode entity.
  domain: automation
  source_url: https://github.com/danrichardson/solarseed-peak-shaver/blob/main/blueprints/automation/solarseed_peak_shaver/preserve_start.yaml
  homeassistant:
    min_version: "2024.8.0"
  input:
    inverter_mode_entity:
      name: Inverter mode entity
      description: >
        The select or switch that sets your inverter's operating mode, for
        example select.ac500_ups_mode (Bluetti AC500).
      selector:
        entity:
          domain:
            - select
            - switch
    preserve_mode_value:
      name: Hold mode value
      description: >
        For a select: the option that keeps the battery and runs the house from
        the grid, written exactly as the select lists it. AC500: TIME_CONTROL.
        Others, for example: "PASSTHROUGH", "Grid First". A switch has no hold:
        it is turned off, which works as stop charging.
      selector:
        text:

trigger:
  - platform: event
    event_type: solarseed_peak_shaver_preserve_start

action:
  - variables:
      inverter_entity: !input inverter_mode_entity

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ inverter_entity.split('.')[0] == 'select' }}
        sequence:
          - action: select.select_option
            target:
              entity_id: !input inverter_mode_entity
            data:
              option: !input preserve_mode_value
      - conditions:
          - condition: template
            value_template: >
              {{ inverter_entity.split('.')[0] == 'switch' }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input inverter_mode_entity

mode: single
