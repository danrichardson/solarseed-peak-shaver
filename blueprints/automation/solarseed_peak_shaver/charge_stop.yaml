blueprint:
  name: "Solarseed - Stop Charging / Solar Priority"
  description: >
    Acts on the Solarseed Peak Shaver event `solarseed_peak_shaver_charge_stop`:
    puts the inverter back in the mode where the house runs on solar, then
    battery. The learned planner fires it at mid-peak start (the end of the
    night hold), when a mid-peak top-up is done, whenever its plan is to run on
    battery, and once if it is handed back to the classic planner or keeps
    failing; the classic planner (legacy) when a charge reaches its target or a
    calculation needs no charge.


    Bluetti AC500 example (Bluetti integration): mode entity
    `select.ac500_ups_mode`, value `PV_PRIORITY` (solar first, then the
    battery; the inverter's own low-battery setting hands the house to the
    grid at its floor, which is the learned planner's gauge floor option).
    Make one automation from each of the three Solarseed blueprints, with the
    same mode entity.
  domain: automation
  source_url: https://github.com/danrichardson/solarseed-peak-shaver/blob/main/blueprints/automation/solarseed_peak_shaver/charge_stop.yaml
  homeassistant:
    min_version: "2024.8.0"
  input:
    inverter_mode_entity:
      name: Inverter mode entity
      description: >
        The select or switch that sets your inverter's operating mode, for
        example select.ac500_ups_mode (Bluetti AC500), select.eg4_work_mode,
        switch.inverter_grid_charge.
      selector:
        entity:
          domain:
            - select
            - switch
    solar_mode_value:
      name: Solar priority mode value
      description: >
        For a select: the option that runs the house on solar and battery,
        written exactly as the select lists it. AC500: PV_PRIORITY. Others, for
        example: "Solar First", "Self Use". For a switch the value is not used:
        the switch is turned off.
      selector:
        text:

trigger:
  - platform: event
    event_type: solarseed_peak_shaver_charge_stop

action:
  - variables:
      inverter_entity: !input inverter_mode_entity

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ inverter_entity.split('.')[0] == 'select' }}
        sequence:
          - action: select.select_option
            target:
              entity_id: !input inverter_mode_entity
            data:
              option: !input solar_mode_value
      - conditions:
          - condition: template
            value_template: >
              {{ inverter_entity.split('.')[0] == 'switch' }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input inverter_mode_entity

mode: single
